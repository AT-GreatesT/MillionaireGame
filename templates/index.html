<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>من سيربح المليون - جورج قرداحي</title>

  <!-- استدعاء ملفات التنسيق -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- عناصر التحكم بالصوت -->
  <div class="audio-controls-container">
    <div class="control-btn" id="musicToggle" title="التحكم في موسيقى الخلفية">
      <i class="fas fa-music"></i>
    </div>
    <div class="control-btn" id="voiceToggle" title="التحكم في صوت جورج">
      <i class="fas fa-microphone"></i>
    </div>
    <div class="control-btn exit-btn" id="exitGame" title="الخروج من اللعبة">
      <i class="fas fa-door-open"></i>
    </div>
  </div>

  <!-- شاشة الترحيب -->
  {% include 'welcome_screen.html' %}

  <!-- شاشة المقدمة -->
  {% include 'intro_screen.html' %}

  <!-- شاشة الشروط -->
  {% include 'rules_screen.html' %}

  <!-- شاشة اللعبة -->
  {% include 'game_screen.html' %}

  <!-- شاشة النهاية -->
  {% include 'outro_screen.html' %}

  <!-- النوافذ المنبثقة -->
  {% include 'modals.html' %}

  <!-- عناصر الصوت -->
  {% include 'audio_elements.html' %}

  <!-- يجب أن يكون utils.js أولاً -->
  <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
  <script src="{{ url_for('static', filename='js/intro.js') }}"></script>
  <script src="{{ url_for('static', filename='js/game.js') }}"></script>
  <script src="{{ url_for('static', filename='js/questions.js') }}"></script>
  <script src="{{ url_for('static', filename='js/lifelines.js') }}"></script>
  <script src="{{ url_for('static', filename='js/outro.js') }}"></script>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
